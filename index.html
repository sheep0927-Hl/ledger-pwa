<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>总账 Ledger</title>

  <!-- PWA / iOS 添加到主屏幕 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#E2554F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="总账" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ 登录页 ============ -->
  <section id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-logo">¥</div>
      <h1>总账 Ledger</h1>
      <p class="login-sub">登录你的账号以同步记录</p>
      <form id="login-form" autocomplete="on">
        <input id="email" type="email" inputmode="email" placeholder="邮箱" autocomplete="username" required />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <button id="login-btn" type="submit" class="btn-primary">登录</button>
      </form>
      <div id="login-msg" class="msg"></div>
    </div>
  </section>

  <!-- ============ 主应用 ============ -->
  <div id="app" class="app hidden">

    <!-- 顶部导航栏（iOS 玻璃导航 + 日期切换） -->
    <header class="topbar glass-nav">
      <!-- 日期模式（今日页） -->
      <div class="nav-datemode" id="nav-datemode">
        <button id="nav-prev" class="nav-arrow" aria-label="前一天">‹</button>
        <button id="nav-date" class="nav-date" aria-label="选择日期">
          <span id="nav-date-main" class="nav-date-main">今天</span>
          <span id="nav-date-sub" class="nav-date-sub">7月28日 周二</span>
        </button>
        <button id="nav-next" class="nav-arrow" aria-label="后一天">›</button>
      </div>
      <!-- 标题模式（历史 / 工资页） -->
      <div class="nav-titlemode hidden" id="nav-titlemode">
        <span id="topbar-title" class="topbar-title"></span>
      </div>
      <div class="nav-meta">
        <span id="sync-status" class="sync-status" role="button" tabindex="0" title="点击立即同步">…</span>
        <button id="logout-btn" class="topbar-logout" title="退出登录">退出</button>
      </div>
    </header>

    <!-- 月历弹层（点击日期展开，底部上滑 Sheet；Apple Calendar 风） -->
    <div id="calendar-sheet" class="calendar-sheet hidden">
      <div class="calendar-backdrop" id="cal-backdrop"></div>
      <div class="calendar-panel glass" id="cal-panel">
        <div class="calendar-head">
          <button id="cal-prev" class="cal-nav" aria-label="上一月">‹</button>
          <span id="cal-title" class="cal-title">2026年7月</span>
          <button id="cal-next" class="cal-nav" aria-label="下一月">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="cal-grid" class="calendar-grid"></div>
        <div class="calendar-foot">
          <button id="cal-today" class="cal-today-btn">今天</button>
          <button id="cal-done" class="cal-done-btn">完成</button>
        </div>
      </div>
    </div>

    <!-- 全局提示 banner（如缺少 material_qty 列） -->
    <div id="global-banner" class="banner hidden"></div>

    <main class="content">

      <!-- ---------- 今日（V3.0 · Health/Wallet 融合） ---------- -->
      <section id="today-view" class="view active">

        <!-- 状态源日期输入（隐藏，由顶部导航驱动，不可删除） -->
        <input id="t-date" type="date" class="hero-date" />

        <!-- Wallet / Health 净收入卡（复用 s-* id + 新增 s-net-money / s-refund-money） -->
        <div class="card net-card">
          <div class="net-label">今日收入</div>
          <div class="net-amount"><b id="s-net-money">0</b></div>
          <div class="net-pills">
            <span class="pill out">出单 <b id="s-out">¥0</b></span>
            <span class="pill pub">发布 <b id="s-pub">¥0</b></span>
            <span class="pill ref">退款 <b id="s-refund-money">¥0</b></span>
            <span class="pill ass" id="row-s-assist">助播 <b id="s-assist">¥0</b></span>
          </div>
          <div class="net-sub">今日 <b id="s-net">0</b> 笔</div>
        </div>

        <!-- 数据录入（真实 7 字段，顺序不变：小红书→抖音→退款→助播→图文→素材→视频） -->
        <div class="section-title">数据录入</div>
        <div class="card entry-card">
          <div class="entry-row">
            <span class="f-ic" style="background:#E4B6B0"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
            <span class="f-name">小红书出单</span>
            <input id="t-xhs" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
          <div class="entry-row">
            <span class="f-ic" style="background:#6B6B70"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></span>
            <span class="f-name">抖音出单</span>
            <input id="t-dy" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
          <div class="entry-row">
            <span class="f-ic" style="background:#E6C49E"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7"/></svg></span>
            <span class="f-name">退款</span>
            <input id="t-refund" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
          <div class="entry-row" id="row-t-assist">
            <span class="f-ic" style="background:#AECBBB"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
            <span class="f-name">助播</span>
            <input id="t-assist" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
          <div class="entry-row">
            <span class="f-ic" style="background:#B2C9E9"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span>
            <span class="f-name">图文</span>
            <input id="t-note" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
          <div class="entry-row">
            <span class="f-ic" style="background:#B9D2D6"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span>
            <span class="f-name">素材</span>
            <input id="t-material" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
          <div class="entry-row">
            <span class="f-ic" style="background:#CBB8DE"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 4 19 12 7 20 7 4"/></svg></span>
            <span class="f-name">视频</span>
            <input id="t-video" type="number" inputmode="numeric" min="0" placeholder="0" />
          </div>
        </div>

        <button id="t-save" class="btn-primary">保存记录</button>
        <div id="t-status" class="hint"></div>

      </section>

      <!-- ---------- 历史 ---------- -->
      <section id="history-view" class="view">
        <div id="history-list" class="history-list"></div>
        <div id="history-empty" class="empty hidden">暂无记录</div>
      </section>

      <!-- ---------- 工资 ---------- -->
      <section id="salary-view" class="view">
        <div class="card">
          <div class="grid2">
            <div class="field"><label>开始日期</label><input id="sal-start" type="date" /></div>
            <div class="field"><label>结束日期</label><input id="sal-end" type="date" /></div>
          </div>
          <div class="quick-range">
            <button data-range="thisMonth" class="chip">本月</button>
            <button data-range="lastMonth" class="chip">上月</button>
            <button data-range="cycle" class="chip">16→15 周期</button>
          </div>
          <button id="sal-calc" class="btn-primary">计算工资</button>
        </div>
        <div id="salary-result" class="card salary-card hidden"></div>
        <div id="salary-empty" class="empty">选择日期后计算工资</div>
      </section>

    </main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab active" data-tab="today">
        <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span>今日</span>
      </button>
      <button class="tab" data-tab="history">
        <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>历史</span>
      </button>
      <button class="tab" data-tab="salary">
        <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/><path d="M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"/><path d="M16 12h.01"/></svg></span><span>工资</span>
      </button>
    </nav>
  </div>

  <!-- 编辑弹层（历史记录编辑复用） -->
  <div id="edit-sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-title">编辑记录</div>
      <div class="card-row">
        <label>日期</label>
        <input id="e-date" type="date" disabled />
      </div>
      <div class="grid2">
        <div class="field"><label>小红书出单</label><input id="e-xhs" type="number" inputmode="numeric" min="0" /></div>
        <div class="field"><label>抖音出单</label><input id="e-dy" type="number" inputmode="numeric" min="0" /></div>
        <div class="field"><label>退款</label><input id="e-refund" type="number" inputmode="numeric" min="0" /></div>
        <div class="field" id="row-e-assist"><label>助播 ¥</label><input id="e-assist" type="number" inputmode="numeric" min="0" /></div>
        <div class="field"><label>图文</label><input id="e-note" type="number" inputmode="numeric" min="0" /></div>
        <div class="field"><label>素材</label><input id="e-material" type="number" inputmode="numeric" min="0" /></div>
        <div class="field"><label>视频</label><input id="e-video" type="number" inputmode="numeric" min="0" /></div>
      </div>
      <div class="sheet-actions">
        <button id="e-delete" class="btn-danger">删除</button>
        <button id="e-cancel" class="btn-ghost">取消</button>
        <button id="e-save" class="btn-primary">保存</button>
      </div>
      <div id="e-status" class="hint"></div>
    </div>
  </div>

  <!-- 显式恢复确认弹层（V2.3-E：保存已删除日期时提示用户是否恢复） -->
  <div id="revive-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-title">恢复已删除的记录</div>
      <div class="modal-body">
        日期 <b id="revive-date"></b> 此前已被删除。是否恢复并保存新数据？
      </div>
      <div class="modal-actions">
        <button id="revive-cancel" class="btn-ghost">取消</button>
        <button id="revive-confirm" class="btn-primary">恢复并保存</button>
      </div>
    </div>
  </div>

  <!-- Supabase JS SDK (UMD, 本地副本，支持离线首启) -->
  <script src="./vendor/supabase.js"></script>
  <!-- 离线本地数据层（原生 IndexedDB 封装，必须先于 app.js 加载） -->
  <script src="./localdb.js"></script>
  <script src="app.js"></script>
</body>
</html>
